name: ✏️ Suggest changes
description: Suggest changes to the RDM Foundations book
title: "[Changes]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to suggest concrete changes to the RDM Foundations book. This can range from signalling a typo or a broken link, to adding, editing or removing entire sections.
  - type: input
    id: summary
    attributes:
      label: Part
      description: "Which chapter of the book are you suggesting changes for?"
      placeholder: part
      value: |
        For example: "Persistent Identifiers", see: https://chstaiger.github.io/rdm-tech-foundations/pids.html
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a detailed description of the chapter you would like to edit, add or restructure. Please provide as much context as possible and link to relating Issues, Discussions and content.
      placeholder: Write your idea(s) here
      value: "I propose to..."
    validations:
      required: true
  - type: textarea
    id: action-required
    attributes:
      label: Action required
      description: What needs to be done to realize your proposal? Try to be concise and if possible, use bullet points.
      placeholder: Actions
      value: "This is what needs to be done:"
    validations:
      required: false
  - type: textarea
    id: who-help
    attributes:
      label: Who can help?
      description: Is there someone/are they persons that can help realize your proposal? E.g., the project maintainers or someone you know who has relevant expertise? Please note that if you input personal data here (e.g., names, email addresses, even GitHub tags), make sure you have their permission to post them here.
      placeholder: Persons who can help
      value: "These persons can help:"
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
